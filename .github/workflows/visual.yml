name: Visual tests

# Playwright captures /dev-components and the Argos reporter uploads the build.
# Builds on main are the Argos baseline that pull requests compare against.
on:
  pull_request:
  push:
    branches: [main]

# id-token: write lets the Argos reporter authenticate with a short-lived
# GitHub Actions OIDC token instead of a stored ARGOS_TOKEN secret.
permissions:
  contents: read
  id-token: write

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
